name: Render health check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/render-health-check.yml"]

# No checkout, secrets, database access, or repository write permissions.
permissions: {}

concurrency:
  group: render-health-check
  cancel-in-progress: false

jobs:
  health:
    # Standard runners are free for public repositories. Do not run on forks
    # or silently start consuming private-repository billing allowances.
    if: github.repository == 'lipton34/healtycheck-render' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the running application
        shell: bash
        run: |
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 70 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            --header 'Cache-Control: no-cache' \
            --user-agent 'saisoku-health-check' \
            --output "$response" \
            'https://saisoku.onrender.com/api/health'
          python3 - "$response" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as response:
              payload = json.load(response)
          if not isinstance(payload, dict) or payload.get("ok") is not True:
              raise SystemExit("Health response did not contain ok: true")
          print("Saisoku health check passed")
          PY
